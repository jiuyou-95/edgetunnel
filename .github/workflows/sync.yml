name: Upstream Sync and Multi-CF Deploy

permissions:
  contents: write
  deployments: write

on:
  schedule:
    # 每天北京时间 08:17（GitHub cron 使用 UTC）
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    outputs:
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        id: sync
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          BEFORE="$(git rev-parse HEAD)"
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          if git diff --quiet HEAD upstream/main; then
            # 内容和上游一致，直接对齐，顺带清理历史分叉留下的多余 merge commit
            git reset --hard upstream/main
            git push --force-with-lease origin main
          else
            # 有本地修改，保持原来的合并方式，不覆盖任何人的改动
            if ! git pull --no-rebase upstream main; then
              echo "[Error] 合并上游变更产生冲突，自动同步已暂停，请手动 Sync Fork 并解决冲突。"
              echo "[Error] Merge conflict detected while syncing upstream. Please sync your fork manually and resolve the conflicts."
              exit 1
            fi
            git push origin main
          fi

          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy_pages:
    name: Deploy Pages ${{ matrix.target }}
    needs: sync_latest_from_upstream
    if: needs.sync_latest_from_upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cf-1
            config: wrangler.pages.toml
          - target: cf-2
            config: wrangler.pages.cf-2.toml
          - target: cf-3
            config: wrangler.pages.cf-3.toml

    steps:
      - name: Checkout updated main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
          ADMIN: ${{ secrets.ADMIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN in environment ${{ matrix.target }}"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID in environment ${{ matrix.target }}"; exit 1; }
          test -n "$WORKER_DOMAIN" || { echo "Missing WORKER_DOMAIN in environment ${{ matrix.target }}"; exit 1; }
          test -n "$ADMIN" || { echo "Missing ADMIN in environment ${{ matrix.target }}"; exit 1; }

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      body = json.load(error)
                  except Exception:
                      body = {"errors": [{"message": str(error)}]}
                  return error.code, body

          status, body = request("GET", f"{base}/tz-pages")
          if status == 404:
              status, body = request("POST", base, {"name": "tz-pages", "production_branch": "main"})
          if status not in (200, 201):
              raise SystemExit("Unable to ensure Pages project: " + json.dumps(body.get("errors", body)))
          print("Pages project tz-pages is ready")
          PY

      - name: Configure Pages ADMIN secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN: ${{ secrets.ADMIN }}
        run: |
          printf '%s' "$ADMIN" | npx --yes wrangler pages secret put ADMIN --project-name=tz-pages

      - name: Prepare Pages Advanced Mode directory
        shell: bash
        run: |
          mkdir -p pages-dist
          cp _worker.js pages-dist/_worker.js
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>tz-pages</title>' > pages-dist/index.html

      - name: Deploy Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy pages-dist --project-name=tz-pages --branch=main --config ${{ matrix.config }} --no-bundle
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach private Custom Domain to Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_DOMAIN: ${{ secrets.WORKER_DOMAIN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          domain = os.environ["WORKER_DOMAIN"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/tz-pages/domains"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def request(method, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      body = json.load(error)
                  except Exception:
                      body = {"errors": [{"message": str(error)}]}
                  return error.code, body

          status, body = request("GET")
          if status != 200:
              raise SystemExit("Unable to list Pages domains: " + json.dumps(body.get("errors", body)))
          names = {item.get("name") for item in body.get("result", [])}
          if domain not in names:
              status, body = request("POST", {"name": domain})
              if status not in (200, 201):
                  raise SystemExit("Unable to attach Pages domain: " + json.dumps(body.get("errors", body)))
          print("Private custom domain is attached to tz-pages")
          PY
